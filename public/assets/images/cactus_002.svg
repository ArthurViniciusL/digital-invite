<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-labelledby="cactus-title">
  <title id="cactus-title">Cacto</title>
  <style>
    .ink    { fill: var(--color-carved-black, #1C1410); }
    .paper  { fill: var(--color-bone-white, #F4EEDD); }
    .sertao { fill: var(--color-sertao-brown, #6B4226); }
  </style>
  <!-- ground mound: short irregular band the trunk sits on -->
  <path class="ink" d="M 4.8 20.9 Q 12 20.1 19.2 20.9 L 19.0 22.3 Q 12 21.5 5.0 22.3 Z"/>
  <!-- main silhouette: trunk plus one low left arm and one high right arm -->
  <path class="ink" d="M 9.7 21.6
    L 9.9 15.8
    L 5.5 15.6
    Q 5.1 12.2 5.3 8.7
    L 8.2 8.5
    L 8.3 12.9
    L 9.9 12.8
    L 10.0 4.0
    Q 12.0 3.2 13.9 3.8
    L 13.9 9.0
    L 15.8 9.1
    L 15.9 6.1
    L 18.75 5.7
    Q 19.1 8.9 18.7 11.9
    L 13.9 12.1
    L 14.0 21.5
    Z"/>
  <!-- three spine nubs, deliberately unevenly placed -->
  <path class="ink" d="M 5.3 11.8 L 4.1 11.1 L 5.3 10.5 Z"/>
  <path class="ink" d="M 18.72 9.3 L 19.9 8.6 L 18.72 8.0 Z"/>
  <path class="ink" d="M 10.0 6.8 L 8.9 6.2 L 10.0 5.6 Z"/>
</svg>
