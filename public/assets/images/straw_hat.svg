<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-labelledby="straw-hat-title">
  <title id="straw-hat-title">Chapéu de palha de São João</title>
  <style>
    .ink    { fill: var(--color-carved-black, #1C1410); }
    .paper  { fill: var(--color-bone-white, #F4EEDD); }
    .sertao { fill: var(--color-sertao-brown, #6B4226); }
  </style>
  <!-- brim: wide band, bellied downwards, apex off centre, the two tips cut unevenly -->
  <path class="ink" d="M 1.7 17.2
    Q 12.5 21.8 22.3 16.9
    Q 22.9 15.8 21.7 15.5
    Q 12.2 18.5 2.6 15.9
    Q 1.2 16.2 1.7 17.2
    Z"/>
  <!-- ribbon tail flying off the right of the band; part of the silhouette, so it survives 16px -->
  <path class="ink" d="M 16.9 13.9
    Q 18.9 12.7 21.1 13.0
    L 19.9 14.1
    L 20.9 15.1
    Q 18.7 15.0 17.0 15.4
    Z"/>
  <!-- low cone crown, rounded crooked tip, with the band cut out as a hole -->
  <path class="ink" fill-rule="evenodd" d="M 5.7 16.9
    Q 6.4 12.0 10.4 7.6
    Q 11.5 6.5 12.9 7.9
    Q 16.4 12.0 18.0 16.7
    Z
    M 6.9 14.05
    L 16.6 14.6
    L 16.45 15.95
    L 6.7 15.25
    Z"/>
</svg>
